{% extends 'base.html' %}

{% block title %}Quản lý {{ category_name }} - EVN RMS{% endblock %}

{% block header_title %}
<div class="flex items-center text-sm">
    <a href="{% url 'category_dashboard' %}" class="text-slate-500 hover:text-blue-600 transition-colors">Quản lý Danh mục</a>
    <i class="fas fa-chevron-right text-slate-400 text-[10px] mx-2"></i>
    <span class="text-slate-800 font-semibold">{{ category_name }}</span>
</div>
{% endblock %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
    <!-- Toolbar -->
    <div class="p-4 border-b border-slate-200 bg-slate-50/50 flex flex-col sm:flex-row gap-4 items-center justify-between">
        <form hx-get="{% url 'category_list' category_id %}" hx-target="#category-list-container" hx-trigger="keyup from:#search-input delay:300ms, search" class="relative w-full sm:w-96">
            <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="search" id="search-input" name="q" value="{{ q }}" placeholder="Tìm kiếm theo mã hoặc tên..." 
                   class="w-full pl-10 pr-4 py-2 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all shadow-sm">
        </form>

        <button hx-get="{% url 'category_create' category_id %}" hx-target="#modal-container" hx-swap="innerHTML" class="w-full sm:w-auto inline-flex items-center justify-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg shadow-sm transition-colors">
            <i class="fas fa-plus mr-2"></i> Thêm mới
        </button>
    </div>

    <!-- Data Table -->
    <div id="category-list-container" hx-get="{% url 'category_list' category_id %}" hx-trigger="categoryListChanged from:body">
        {% include 'categories/partials/category_list_partial.html' %}
    </div>
</div>

<!-- Modal Container -->
<div id="modal-container"></div>
{% endblock %}
